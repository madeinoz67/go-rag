name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly off-peak scan; catches advisories landing between pushes.
    - cron: '27 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (go)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
