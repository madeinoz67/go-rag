// contracts/gorag.proto — gRPC schema for go-rag server APIs
// Feature 003-rest-grpc-api. Operation surface served by the internal/grpc
// adapter (grpc-go — same stack as MuninnDB). One .proto → canonical gRPC over
// HTTP/2; clients in any language interop unchanged. Mirrors internal/engine 1:1.
//
// Mirrors the internal/engine facade 1:1 (see data-model.md). All messages are
// the transport projection of the facade's structured result types — adapters
// add no independent logic.

syntax = "proto3";

package gorag;

option go_package = "github.com/madeinoz67/go-rag/proto/gen;goragpb";

// Gorag is the unified operation surface served over gRPC. Every RPC maps to one
// internal/engine method and to one MCP tool and one REST endpoint (parity).
service Gorag {
  // Query the corpus (hybrid/semantic/keyword). → engine.Query
  rpc Query(QueryRequest) returns (QueryResponse);

  // Corpus counts + model + embedding reachability. → engine.Status
  rpc Status(StatusRequest) returns (StatusResponse);

  // Ingest a file or directory path. ACKs fast; indexes async. → engine.Add
  rpc Add(AddRequest) returns (IngestSummary);

  // Scan watched dirs once; apply adds/mods/deletes. → engine.Scan
  rpc Scan(ScanRequest) returns (IngestSummary);

  // Force re-ingest a path (bypass dedup). → engine.Reprocess
  rpc Reprocess(ReprocessRequest) returns (IngestSummary);

  // Re-embed docs whose model != current. → engine.Migrate
  rpc Migrate(MigrateRequest) returns (IngestSummary);

  // H24/spec 028: preview a migration (what would change + cost) without re-embedding. → engine.MigratePlan
  rpc MigratePlan(MigratePlanRequest) returns (MigrationPlan);

  // List ingested files. → engine.Files
  rpc Files(FilesRequest) returns (FilesResponse);

  // List ingested dirs with counts. → engine.Dirs
  rpc Dirs(DirsRequest) returns (DirsResponse);

  // Get or set a config value. → engine.GetConfig / SetConfig
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc SetConfig(SetConfigRequest) returns (SetConfigResponse);

  // List all vaults with doc counts. → engine.ListVaults
  rpc ListVaults(ListVaultsRequest) returns (ListVaultsResponse);

  // Liveness/readiness. → health probe (also REST GET /health)
  rpc Health(HealthRequest) returns (HealthResponse);

  // H04/spec 019: quarantine management (also REST /v1/poison, MCP poison_*).
  rpc ListPoisoned(ListPoisonedRequest) returns (ListPoisonedResponse);
  rpc ReleaseChunk(ReleaseChunkRequest) returns (PoisonActionResponse);
  rpc ResetChunk(ResetChunkRequest) returns (PoisonActionResponse);
  rpc RescanPoisoning(RescanPoisoningRequest) returns (RescanPoisoningResponse);

  // spec 035 (BL-001): fetch a single chunk by its content-addressed ID, with
  // parent document metadata. → engine.GetChunk (also REST GET /v1/chunks/{id},
  // MCP go_rag_get_chunk, CLI `go-rag chunk get`).
  rpc GetChunk(GetChunkRequest) returns (GetChunkResponse);
  // spec 037 (BL-002): a chunk plus up to N neighbours on each side, in one
  // call. → engine.GetChunkContext (also REST GET /v1/chunks/{id}/context,
  // MCP go_rag_get_chunk_context, CLI `go-rag chunk context`).
  rpc GetChunkContext(GetChunkContextRequest) returns (GetChunkContextResponse);
  // spec 038 (BL-003): resolve up to 100 chunks by id in one call. Per-id error
  // (partial success) — a missing id yields an empty chunk + error, not a call
  // failure. → engine.BatchGetChunks (also REST POST /v1/chunks/batch,
  // MCP go_rag_batch_get_chunks, CLI `go-rag chunk batch`).
  rpc BatchGetChunks(BatchGetChunksRequest) returns (BatchGetChunksResponse);
  // spec 039 (BL-007): list documents — reliable ingested_at cursor + status
  // filter + page_token pagination. → engine.ListDocuments (also REST
  // GET /v1/documents, MCP go_rag_list_documents, CLI `go-rag documents list`).
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  // spec 047 (Slice 1): list a document's chunks — chunk_index cursor +
  // page_token pagination. → engine.ListChunks (also REST
  // GET /v1/documents/{id}/chunks, MCP go_rag_list_chunks, CLI `go-rag chunk list`).
  rpc ListChunks(ListChunksRequest) returns (ListChunksResponse);
  // spec 040 (BL-008): long-lived server-stream of document lifecycle events
  // (INGESTED/EMBEDDED/DELETED). → engine's event bus. gRPC-only — streaming has
  // no unary equivalent (REST push = BL-011 webhook, separate).
  rpc WatchDocuments(WatchRequest) returns (stream DocumentEvent);
}

// ---- Query ----

message QueryRequest {
  string query = 1;
  int32 k = 2;                  // default 5, clamped [1,100]
  string mode = 3;              // "hybrid" (default) | "semantic" | "keyword"
  bool no_rerank = 4;
  double threshold = 5;         // min score, default 0.0
  int32 rrf_k = 6;              // H08/spec 009: RRF smoothing constant override; 0 = config/default (60)
  string source = 7;            // H14/spec 014: path glob/prefix filter (empty = no constraint)
  string type = 8;              // H14/spec 014: file type filter (empty = no constraint)
  repeated string tags = 9;     // H14/spec 014: tag conjunction filter (empty = no constraint)
  int32 context_window = 10;    // H15/spec 015: N sibling chunks of context each side; 0 = off
  bool no_cache = 11;            // H06/spec 016: bypass the query result cache for this query (forces a fresh result)
  bool include_quarantined = 12; // H04/spec 019: return chunks flagged as injection-poisoning (excluded by default)
  int32 pool_size = 13;          // H22/spec 024: reranker candidate-pool override; 0 = config/default (60); shrinks with classifier-recommended k
  bool dedup = 14;               // H20/spec 026: collapse near-duplicate hits (default false)
}
message QueryHit {
  string chunk_id = 1;
  string document_id = 2;
  double score = 3;
  string content = 4;           // full chunk text
  string file_path = 5;
  int32 page = 6;               // 0 if not paginated
  Poisoning poisoning = 7;      // H04/spec 019: per-chunk injection verdict (nil = clean/unscored)
  int32 chunk_index = 8;        // H21/spec 023: 0-based ordinal within the source document
  repeated string section_context = 9; // H23/spec 025: heading breadcrumb at the chunk's start (empty = none)
  NearDup near_dup = 10; // H20/spec 026: near-duplicate context (nil = none/pre-feature)
  string summary = 11;           // spec 029: document summary (empty = unenriched)
  string enrichment_status = 12; // spec 029: enriched|failed|nothing-to-enrich (empty = unenriched)
  repeated string wikilinks         = 13; // spec 036 / BL-004: [[wikilink]] targets in this chunk (empty = none/pre-feature)
  int32 section_depth = 14; // spec 041 / BL-005: governing heading level (1-6; 0 = none/pre-feature)
  double extraction_quality = 15; // spec 042 / BL-006: 0-1 coverage confidence
  string extraction_method = 16; // spec 042 / BL-006: native|mixed|image
}

// NearDup is the per-chunk near-duplicate context (H20/spec 026). Mirrors
// model.NearDupInfo 1:1. Siblings are chunkIDs within the configured Hamming
// threshold; similarity is the closest sibling in [0,1].
message NearDup {
  repeated string siblings = 1;
  double similarity = 2;
}

// Poisoning is the per-chunk injection-poisoning verdict (H04/spec 019). The
// high-precision signal is `instruction` (1.0 if a curated phrase matched);
// repetition/stuffing are secondary boosters. Mirrors model.PoisonVerdict 1:1.
message Poisoning {
  string level = 1;                   // clean|suspicious|quarantine|released
  double score = 2;                   // combined score in [0,1]
  PoisoningSignals signals = 3;
  repeated string matched_phrases = 4; // instruction-phrase hits
}
message PoisoningSignals {
  double repetition = 1;
  double stuffing = 2;
  double instruction = 3;
}

// H04/spec 019: quarantine management (US2, FR-006). Mirrors engine.ListPoisoned /
// ReleaseChunk / ResetChunk (also REST /v1/poison, MCP poison_*).
message ListPoisonedRequest {}
message ListPoisonedResponse {
  repeated PoisonedChunk flagged = 1;
}
message PoisonedChunk {
  string chunk_id = 1;
  string document_id = 2;
  string preview = 3;
  Poisoning verdict = 4;
}
message ReleaseChunkRequest {
  string chunk_id = 1;
}
message ResetChunkRequest {
  string chunk_id = 1;
}
message PoisonActionResponse {
  string chunk_id = 1;
  string status = 2; // "released" | "reset"
}
message RescanPoisoningRequest {}
message RescanPoisoningResponse {
  int32 rescored = 1; // chunks (re)scored
  int32 flagged = 2;  // now flagged (suspicious/quarantine)
}

// spec 035 (BL-001): fetch a single chunk by content-addressed ID. The request
// carries only chunk_id — the engine is single-vault-per-process, so (unlike the
// bridge backlog's draft) there is NO vault field; mirrors ReleaseChunkRequest.
message GetChunkRequest {
  string chunk_id = 1;
}

// GetChunkResponse carries the resolved chunk and its parent document metadata
// in one call. Chunk projects model.Chunk; DocumentMeta projects model.Document
// (+ spec-029 EnrichInfo). Reuses the existing Poisoning / NearDup messages.
message GetChunkResponse {
  Chunk        chunk    = 1;
  DocumentMeta document = 2;
}

// spec 037 (BL-002): request a chunk plus up to `window` neighbours each side.
message GetChunkContextRequest {
  string chunk_id = 1;
  int32  window   = 2; // default 2, clamped [0,10]; >10 → INVALID_ARGUMENT
}

// spec 037 (BL-002): the ordered context window [predecessors][target][successors],
// the requested chunk's index, and the parent document (zero-valued if orphan).
message GetChunkContextResponse {
  repeated Chunk chunks       = 1;
  int32          target_index = 2;
  DocumentMeta   document     = 3;
}

// spec 038 (BL-003): request up to 100 content-addressed chunk ids (no vault).
message BatchGetChunksRequest {
  repeated string chunk_ids = 1; // max 100; >100 / empty / empty-element → INVALID_ARGUMENT
}

// spec 038 (BL-003): one positional result entry — the requested id, its chunk
// (zero-value if not found), a non-empty error when this id failed, and the
// parent document (zero-value if orphan/not-found). Mirrors GetChunk per entry.
message BatchGetChunksResult {
  string      chunk_id  = 1;
  Chunk       chunk     = 2; // zero-value if not found
  string      error     = 3; // non-empty iff this chunk_id failed ("not found")
  DocumentMeta document = 4; // parent document; zero-value if orphan/not-found
}

// spec 038 (BL-003): ordered 1:1 with the request chunk_ids (same length,
// including duplicates and missing ids).
message BatchGetChunksResponse {
  repeated BatchGetChunksResult results = 1;
}

// spec 039 (BL-007): list documents — cursor + status filter + pagination.
message ListDocumentsRequest {
  int32  page_size  = 1; // default 50, max 200; <1 or >200 → INVALID_ARGUMENT
  string page_token = 2; // opaque; empty → first page
  string after      = 3; // RFC3339; only docs with ingested_at > after; "" → all
  string status     = 4; // embedded|pending|error|"" (all); AND with after
  repeated string tags = 5; // spec 047: tag filter, match-any (doc has ≥1 of these); empty = no constraint
}

// spec 039 (BL-007): one page of documents + the cursor for the next page.
message ListDocumentsResponse {
  repeated DocumentMeta documents       = 1; // ordered (ingested_at ASC, id ASC)
  string                next_page_token = 2; // empty ⇒ last page
}

// spec 047 (Slice 1): list one document's chunks, paginated by chunk_index.
message ListChunksRequest {
  string document_id = 1; // required; empty → INVALID_ARGUMENT
  int32  page_size   = 2; // default 50, max 200; <1 or >200 → INVALID_ARGUMENT
  string page_token  = 3; // opaque; empty → first page
}

// spec 047 (Slice 1): one page of chunks + the cursor for the next page.
message ListChunksResponse {
  repeated Chunk chunks           = 1; // ordered (chunk_index ASC, chunk_id ASC)
  string          next_page_token = 2; // empty ⇒ last page
}

// spec 040 (BL-008): document lifecycle event kinds. RE_INGESTED is reserved for
// BL-010 (before/after delta) and is NOT emitted by the MVP.
enum DocumentEventType {
  INGESTED    = 0; // metadata durably committed; embedding may still be pending
  EMBEDDED    = 1; // async embedding complete — safe to promote
  RE_INGESTED = 2; // reserved (BL-010 — not emitted in the MVP)
  DELETED     = 3;
}

// spec 040 (BL-008): open a long-lived stream; cursor resumes after a prior event.
message WatchRequest {
  string cursor = 1; // opaque resume token; empty = start from now (no replay)
}

// spec 040 (BL-008): one document lifecycle event on the WatchDocuments stream.
message DocumentEvent {
  DocumentEventType type         = 1;
  string            document_id  = 2;
  string            source_path  = 3;
  string            cursor       = 4; // opaque; persist + pass on reconnect
  DocumentMeta      after        = 5; // INGESTED/EMBEDDED: the document version
  int64             timestamp_ms = 6;
  // spec 043 / BL-010: the per-chunk delta. Present only on RE_INGESTED events
  // (empty for INGESTED/EMBEDDED/DELETED). Consumers use prev_chunk_id of
  // UNCHANGED/REMOVED entries to remap stored chunk_id references.
  repeated ChunkDelta chunk_deltas = 7;
}

// ChunkDelta is one chunk's change in a RE_INGESTED event (spec 043 / BL-010).
message ChunkDelta {
  enum ChangeType {
    ADDED     = 0; // new-version chunk with no content-match in the old
    REMOVED   = 1; // old-version chunk with no content-match in the new
    UNCHANGED = 2; // content-match; prev_chunk_id -> chunk_id is the remap
  }
  ChangeType change_type   = 1;
  string     chunk_id      = 2; // the NEW chunk's id (ADDED + UNCHANGED)
  string     prev_chunk_id = 3; // the OLD chunk's id (UNCHANGED + REMOVED)
}

// Chunk is the transport projection of model.Chunk for a point fetch (spec 035).
// Mirrors the QueryHit field set plus the full position / linked-list span a
// debug or bridge caller needs. Poisoning / NearDup reuse the existing messages.
message Chunk {
  string          chunk_id          = 1;
  string          document_id       = 2;
  string          content           = 3;
  int32           chunk_index       = 4;
  int32           total_chunks      = 5;
  int32           page_number       = 6;   // 0 = not paginated
  int32           start_char        = 7;
  int32           end_char          = 8;
  int32           token_count       = 9;
  string          previous_chunk_id = 10;
  string          next_chunk_id     = 11;
  Poisoning       poisoning         = 12;  // nil = clean/unscored
  repeated string section_context   = 13;
  NearDup         near_dup          = 14;  // nil = none
  string          kind              = 15;  // e.g. "caption"; empty = ordinary text
  string          created_at        = 16;  // RFC3339; empty if unset
  repeated string wikilinks         = 17;  // spec 036 / BL-004: [[wikilink]] targets in this chunk (empty = none/pre-feature)
  int32           section_depth     = 18;  // spec 041 / BL-005: governing heading level (1-6; 0 = none/pre-feature)
  double          extraction_quality  = 19;  // spec 042 / BL-006: 0-1 coverage confidence (1.0 = clean text; lower = sparse/image)
  string          extraction_method   = 20;  // spec 042 / BL-006: native|mixed|image ("" = pre-feature/default native)
}

// DocumentMeta is the transport projection of model.Document (+ spec-029
// EnrichInfo flattened) — the parent-document context a chunk consumer needs in
// the same call (spec 035 US2). id is the identity hash; content_hash is the
// distinct change-detection hash (PRD §7.2) — do not collapse them.
message DocumentMeta {
  string          id                = 1;
  string          content_hash      = 2;
  string          source_id         = 3;
  string          source_path       = 4;   // absolute source dir (optional 3rd read)
  string          file_path         = 5;   // relative to the source root
  string          file_name         = 6;
  string          file_type         = 7;
  string          mime_type         = 8;
  int32           chunk_count       = 9;
  int64           file_size         = 10;
  string          status            = 11;  // pending|embedded|error
  string          ingested_at       = 12;  // RFC3339
  string          updated_at        = 13;  // RFC3339
  repeated string tags              = 14;  // spec 029 enrichment
  string          summary           = 15;  // spec 029 enrichment
  string          enrichment_status = 16;  // enriched|failed|nothing-to-enrich
  string          enrichment_model  = 17;
  string          enrichment_at     = 18;  // RFC3339
}
message QueryResponse {
  repeated QueryHit hits = 1;
  bool rerank_failed = 2;          // H09: true iff reranking was attempted and failed; hits are then fallback-ordered
  int32 effective_k = 3;           // H22/spec 024: depth actually used (explicit|recommended|default)
  int32 effective_pool = 4;        // H22/spec 024: candidate pool actually used (per-query|classifier|config)
  string effective_mode = 5;       // H22/spec 024: mode used (echo; mode is never auto-changed)
}

// ---- Status ----

message StatusRequest {}
message StatusResponse {
  int32 documents = 1;
  int32 chunks = 2;
  int32 embeddings = 3;
  int32 dimensions = 4;
  string embedding_model = 5;
  string reranker = 6;          // "disabled" if unset
  string ollama_url = 7;
  bool embeddings_complete = 8;
  int32 pool_size = 9;          // H22/spec 024: configured candidate-pool ceiling
  bool adaptive_depth_enabled = 10; // H22/spec 024: rule-based k-classifier posture
  PoolUtilization pool_utilization = 11; // H22/spec 024: aggregate pool-utilization signal
  bool enrichment_enabled = 12; // spec 029: background enrichment on
  int32 enriched_docs = 13;     // spec 029: documents with a non-nil Enrichment sidecar
}

// PoolUtilization (H22/spec 024) — aggregate candidate-pool consumption over the
// process lifetime, surfaced in Status (NOT per-query). Mirrors engine.PoolUtilization.
message PoolUtilization {
  uint64 queries = 1;       // observed (non-cached) queries since start
  double avg_fetched = 2;   // mean effective pool fetched
  double avg_kept = 3;      // mean results returned (avg_fetched/avg_kept = expansion)
  uint64 saturated = 4;     // queries that couldn't fill the requested depth
}

// ---- Ingest family ----

message AddRequest {
  string path = 1;
  string glob = 2; // optional file-pattern filter (e.g. "*.pdf"); empty = "*"
}
message ScanRequest {}
message ReprocessRequest { string path = 1; }
message MigrateRequest {}

// H24/spec 028: read-only migration preview request (no args). Mirrors the
// REST POST /v1/migrate/plan and the MCP go_rag_migrate_plan tool.
message MigratePlanRequest {}

// MigrationPlan is the read-only migration preview (H24/spec 028). Mirrors
// engine.MigrationPlan 1:1.
message MigrationPlan {
  string target_model = 1;          // model a real migrate would re-embed onto
  int32 total = 2;                   // total tracked embeddings
  int32 stale_total = 3;            // embeddings a real migrate would re-embed
  repeated ModelCount sources = 4;  // per stored model
  repeated DimCount dimensions = 5; // stored dimensionality distribution
  bool consistent = 6;              // single model+dim+convention
  Estimate estimate = 7;            // labelled-approximate cost
}
message ModelCount {
  string model = 1;
  int32 count = 2;
  bool stale = 3; // model != target_model
}
message DimCount {
  int32 dim = 1;
  int32 count = 2;
}
message Estimate {
  int32 stale_embeddings = 1;
  bool model_change = 2;
  bool mixed_corpus = 3;
  string note = 4; // always: an estimate, not a time guarantee
}

message IngestSummary {
  int32 new = 1;
  int32 skipped = 2;
  int32 modified = 3;           // scan only
  int32 deleted = 4;            // scan only
  int32 errors = 5;
}

// ---- Files / Dirs ----

message FilesRequest {}
message FileEntry {
  string file_path = 1;
  string file_type = 2;
  string status = 3;
  int32 chunk_count = 4;
}
message FilesResponse { repeated FileEntry files = 1; }

message DirsRequest {}
message DirEntry {
  string dir = 1;
  int32 files = 2;
  int32 chunks = 3;
}
message DirsResponse { repeated DirEntry dirs = 1; }

// ---- Config ----

message GetConfigRequest { string key = 1; }   // empty → all
message GetConfigResponse { map<string, string> values = 1; }
message SetConfigRequest { string key = 1; string value = 2; }
message SetConfigResponse { string key = 1; string value = 2; }

// ---- Vaults ----

message ListVaultsRequest {}
message VaultEntry { string name = 1; int32 documents = 2; }
message ListVaultsResponse { repeated VaultEntry vaults = 1; }

// ---- Health ----

message HealthRequest {}
message HealthResponse {
  bool ok = 1;
  bool storage_open = 2;
  bool embedder_reachable = 3;
  bool ready = 4;            // H11/spec 017: readiness — false on hard embedding drift (queries not servable); ok stays true (liveness)
  string drift_verdict = 5;  // H11/spec 017: clean|hard-drift|version-warning|unknown|n/a
}
