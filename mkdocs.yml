site_name: go-rag
site_description: A single-binary local RAG database for your documents.
repo_url: https://github.com/madeinoz67/go-rag
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Install: getting-started/install.md
      - Quickstart: getting-started/quickstart.md
  - Concepts:
      - Retrieval Model: concepts/retrieval.md
      - Chunking: concepts/chunking.md
      - Embeddings: concepts/embeddings.md
  - Guide:
      - Ingestion: guide/ingest.md
      - Querying: guide/query.md
      - Daemon: guide/daemon.md
      - Management Console: guide/console.md
  - Reference:
      - CLI: reference/cli.md
      - MCP Tools: reference/mcp.md
      - REST API: reference/rest.md
      - gRPC API: reference/grpc.md
      - Configuration: reference/configuration.md
  - Operating:
      - Observability: operating/observability.md
      - Retrieval Poisoning Defense: operating/poisoning.md
      - Secret / PII Redaction: operating/redaction.md
      - Structured Audit Log: operating/audit.md
      - Citation Contract: operating/citation-contract.md
  - Internals:
      - Product Spec (PRD): internals/PRD_RAG_Database.md
      - Keyspace Registry: internals/keyspace-registry.md
      - Console Style Guide: internals/style-guide.md
      - Design - Auth Tokens: internals/design/auth-tokens.md
      - Design - Chunk Identity: internals/design/bl010-chunk-identity.md
      - Design - Engine Serialization: internals/design/engine-serialization.md

plugins: []
